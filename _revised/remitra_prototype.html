<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remitra™ Supplier Portal · Clickable Prototype · William Teppig</title>
<style>
  html,body{margin:0;background:#2b2f33;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #stage{display:flex;justify-content:center;min-height:100vh;padding-bottom:64px}
  #wrap{position:relative;width:100%;max-width:1440px;line-height:0}
  #screen{display:block;width:100%;height:auto;background:#fff;cursor:default}
  #hs{position:absolute;inset:0}
  #hs a{position:absolute;display:block;cursor:pointer;border-radius:4px;outline:2px solid transparent;transition:outline-color .15s, background-color .15s}
  #hs a:hover{outline-color:rgba(0,150,180,.55)}
  #hs.flash a, #hs.show a{outline-color:rgba(0,170,200,.9);background:rgba(0,170,200,.16)}
  #bar #hsbtn.on{background:#0e7c8f;border-color:#0e7c8f}
  #bar{position:fixed;left:12px;bottom:12px;z-index:10;display:flex;gap:6px;align-items:center;
       background:rgba(20,24,28,.92);color:#fff;padding:6px 8px;border-radius:8px;font-size:12px;
       box-shadow:0 2px 10px rgba(0,0,0,.4)}
  #bar button,#bar select{font:inherit;background:#3a4047;color:#fff;border:1px solid #555;border-radius:5px;padding:4px 8px;cursor:pointer}
  #bar select{max-width:360px}
  #bar.min > :not(#toggle):not(#scen):not(#back){display:none}
  #bar #scen{background:#0e7c8f;border-color:#0e7c8f}
  #modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
  #modal.open{display:flex}
  #mbox{background:#fff;border-radius:8px;width:min(900px,94vw);box-shadow:0 10px 40px rgba(0,0,0,.5);overflow:hidden}
  #mhead{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid #e3e6e8}
  #mhead .tab{font:inherit;font-size:13px;background:#f1f3f4;color:#1b2a33;border:1px solid #d5dadd;border-radius:5px;padding:5px 12px;cursor:pointer}
  #mhead .tab.on{background:#0e7c8f;color:#fff;border-color:#0e7c8f}
  #mclose{margin-left:auto;font-size:20px;line-height:1;background:none;border:none;cursor:pointer;color:#333;padding:2px 8px}
  #mimg{display:block;width:100%;height:auto}
  #count{opacity:.75;min-width:48px;text-align:center}
</style>
</head>
<body>
<div id="stage"><div id="wrap"><img id="screen" alt=""><div id="hs"></div></div></div>
<div id="bar">
  <a id="back" href="remitra_supplier_portal.html" title="Back to the case study" style="color:#fff;text-decoration:none;background:#3a4047;border:1px solid #555;border-radius:5px;padding:4px 8px">← Case study</a>
  <button id="prev" title="Previous (←)">‹</button>
  <span id="count"></span>
  <button id="next" title="Next (→)">›</button>
  <select id="flow" title="Flow"></select>
  <select id="pick" title="Screen"></select>
  <button id="hsbtn" title="Show all hotspots (G)">Hotspots</button>
  <button id="scen" title="Scenario instructions (S)">Scenarios</button>
  <button id="toggle" title="Hide / show controls (H)">–</button>
</div>
<div id="modal" role="dialog" aria-modal="true" aria-label="Scenario instructions">
  <div id="mbox">
    <div id="mhead">
      <button class="tab" data-s="1">Scenario 1</button>
      <button class="tab" data-s="2">Scenario 2</button>
      <button class="tab" data-s="3">Scenario 3</button>
      <button id="mclose" title="Close (Esc)" aria-label="Close">×</button>
    </div>
    <img id="mimg" alt="">
  </div>
</div>

const ALL = [];
FLOWS.forEach((f,fi)=>f.screens.forEach(s=>ALL.push({file:s,flow:fi})));
const img=document.getElementById('screen'), count=document.getElementById('count'),
      flowSel=document.getElementById('flow'), pick=document.getElementById('pick'), bar=document.getElementById('bar');
FLOWS.forEach((f,i)=>flowSel.add(new Option(f.name,i)));
let cur=0, lastFlow=null;

function label(f){return f.replace(/\.(png|jpg)$/,'').replace(/_/g,' ');}
function fillPick(fi){
  pick.innerHTML='';
  ALL.forEach((s,i)=>{ if(s.flow==fi) pick.add(new Option(label(s.file),i)); });
}
function show(i,keepScroll){
  cur=(i+ALL.length)%ALL.length;
  const s=ALL[cur];
  img.src=srcFor(s.file); img.alt=label(s.file); renderHotspots();
  if(lastFlow!==s.flow){flowSel.value=s.flow; fillPick(s.flow); lastFlow=s.flow;}
  pick.value=cur;
  const inFlow=ALL.filter(x=>x.flow==s.flow), pos=inFlow.indexOf(s)+1;
  count.textContent=pos+' / '+inFlow.length;
  if(!keepScroll) window.scrollTo(0,0);
  try{ if(location.hash!=='#s'+(cur+1)) history.replaceState(null,'','#s'+(cur+1)); }catch(e){}
  // preload next
  const n=new Image(); n.src=srcFor(ALL[(cur+1)%ALL.length].file);
}
// Clicking outside a hotspot briefly highlights where you can click
const hsLayer=document.getElementById('hs');
let flashT;
img.addEventListener('click',()=>{ hsLayer.classList.add('flash'); clearTimeout(flashT); flashT=setTimeout(()=>hsLayer.classList.remove('flash'),700); });
function srcFor(file){ return IMG['screens/'+file]; }
function renderHotspots(){
  hsLayer.innerHTML='';
  const base=ALL[cur].file;
  (HOTSPOTS[base]||[]).forEach(hs=>{
    const a=document.createElement('a');
    a.style.left=hs.x+'%'; a.style.top=hs.y+'%'; a.style.width=hs.w+'%'; a.style.height=hs.h+'%';
    a.title=hs.label||'';
    a.addEventListener('click',e=>{
      e.stopPropagation();
      if(hs.action==='scenarios'){ openModal(); return; }
      const i=ALL.findIndex(s=>s.file===hs.to);
      if(i>=0) show(i);
    });
    if(hs.hover){
      a.addEventListener('mouseenter',()=>{ img.src=srcFor(hs.hover); });
      a.addEventListener('mouseleave',()=>{ img.src=srcFor(base); });
      new Image().src=srcFor(hs.hover);
    }
    hsLayer.appendChild(a);
  });
}
document.getElementById('hsbtn').onclick=()=>{ hsLayer.classList.toggle('show'); document.getElementById('hsbtn').classList.toggle('on'); };
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
flowSel.onchange=()=>{ const fi=+flowSel.value; show(ALL.findIndex(s=>s.flow==fi)); };
pick.onchange=()=>show(+pick.value);
document.getElementById('toggle').onclick=()=>bar.classList.toggle('min');
// Scenario modal
const modal=document.getElementById('modal'), mimg=document.getElementById('mimg'), tabs=[...document.querySelectorAll('#mhead .tab')];
let scen=1;
const NSCEN=3;
function setScen(n){ scen=((n-1+NSCEN)%NSCEN)+1; mimg.src=IMG['scenarios/Scenario'+scen+'.png']; mimg.alt='Scenario '+scen;
  tabs.forEach(t=>t.classList.toggle('on',+t.dataset.s===scen)); }
function openModal(){ setScen(scen); modal.classList.add('open'); }
function closeModal(){ modal.classList.remove('open'); }
const isOpen=()=>modal.classList.contains('open');
document.getElementById('scen').onclick=()=>isOpen()?closeModal():openModal();
document.getElementById('mclose').onclick=closeModal;
tabs.forEach(t=>t.onclick=()=>setScen(+t.dataset.s));
modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
setScen(1);

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT') return;
  if(e.key==='s'||e.key==='S'){ isOpen()?closeModal():openModal(); return; }
  if(!isOpen()&&(e.key==='g'||e.key==='G')){ document.getElementById('hsbtn').click(); return; }
  if(isOpen()){
    if(e.key==='Escape') closeModal();
    else if(e.key==='ArrowRight') setScen(scen+1);
    else if(e.key==='ArrowLeft') setScen(scen-1);
    return;
  }
  if(e.key==='ArrowRight') show(cur+1);
  else if(e.key==='ArrowLeft') show(cur-1);
  else if(e.key==='h'||e.key==='H') bar.classList.toggle('min');
});
const m=/^#s(\d+)$/.exec(location.hash);
show(m?(+m[1]-1):0);
if(cur===0) openModal(); // first page of the demo opens with the scenario instructions
</script>
